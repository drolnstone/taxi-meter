<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi Meter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{font-family:-apple-system,Arial;background:#0b0b0b;color:white;margin:0;padding:20px}
h1{text-align:center;margin-bottom:20px}
.fareDisplay{text-align:center;margin-bottom:25px}
.fareLabel{font-size:18px;color:#999}
.fareValue{font-size:72px;font-weight:bold;color:#FFD60A;letter-spacing:3px}
#tariff{text-align:center;font-size:16px;margin-bottom:10px;padding:6px;border-radius:6px;background:#333;color:#fff;width:100px;margin-left:auto;margin-right:auto;}

.reset{background:#3a3a3c;color:white}

#destStatus{font-size:14px;color:#999;text-align:center;min-height:18px}
#estimateBox{margin-top:10px;padding:14px;background:#12251a;border-left:3px solid #34c759;border-radius:10px}
.estLine{font-size:15px;color:#9fdfb5;margin:2px 0}
.estFare{font-size:26px;font-weight:bold;color:#34c759;margin:6px 0}
.estNote{font-size:13px;color:#7a9a86;margin-top:6px}
#navBanner{background:#0a2a4a;border-left:3px solid #0a84ff;border-radius:12px;padding:14px;margin-bottom:18px}
#navDist{font-size:28px;font-weight:bold;color:#5ab0ff}
#navText{font-size:18px;color:#dbe9f7;margin-top:4px}
#navMeta{font-size:13px;color:#7fa8cc;margin-top:6px}
.warn{background:#3a2a0a;border-left:3px solid #ff9f0a;border-radius:10px;padding:10px;font-size:14px;color:#ffcf7a;margin-top:10px}
</style>
</head>
<body>

<h1>Taxi Meter</h1>

<div class="card">
  <label class="fieldLabel">Driver ID</label>
  <input id="driverInput" type="text" placeholder="Enter your Driver ID" oninput="onIdInput()" onkeydown="if(event.key==='Enter')validateId()" maxlength="8">

  <div id="idStatus"></div>
</div>

  <input id="destInput" type="text" placeholder="L4 0TH or 24 Scotland Road" autocomplete="off">
  <div id="suggestions"></div>
  <div id="destStatus"></div>
  <div id="estimateBox" style="display:none"></div>
  <button id="clearDestBtn" class="reset" onclick="clearDestination()" style="display:none">Clear destination</button>
</div>

<div id="tariff">Day</div>

<div id="navBanner" style="display:none">
  <div id="navDist"></div>
  <div id="navText"></div>
  <div id="navMeta"></div>
</div>

<div class="fareDisplay">
  <div class="fareLabel">FARE</div>
  <div id="fare" class="fareValue">£3.40</div>
</div>

<div class="card">
  <div class="row"><span>Distance</span><span id="distance">0.00 mi</span></div>
  <div class="row"><span>Time</span><span id="time">00:00:00</span></div>
</div>

<div class="card">
  <button id="startBtn" class="start" disabled>Verify ID First</button>
  <button id="resetBtn" class="reset" disabled>Reset</button>
  <div id="gps">GPS idle</div>

</div>

<div class="card">
  <h3>Route</h3>
  <div id="map"></div>
</div>

<div class="card">
  <h3>Earnings Dashboard</h3>
  <div>Today: £<span id="todayEarn">0</span></div>
  <div>This week: £<span id="weekEarn">0</span></div>
  <div>This month: £<span id="monthEarn">0</span></div>
  <div>Lifetime: £<span id="lifeEarn">0</span></div>
  <div>Average fare: £<span id="avgFare">0</span></div>
</div>

<div class="card">
  <h3>Trip History (Latest 5)</h3>
  <div id="history"></div>
  <button class="export" onclick="exportTrips()">Export CSV</button>
  <button id="syncBtn" class="sync" onclick="syncToSheet()">Sync to Google Sheets</button>
  <div id="syncStatus"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const SYNC_URL = "https://script.google.com/macros/s/AKfycbwfVdwML13iR7X_RQDB9ntchayc-byxHEWjp__Xcxiy9w0LmaepWt5VwAaYNd4BAppx/exec"

/* Routing and geocoding services */
const ORS_KEY        = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImY2NjMzMDJhZTQzMTRlNTY5Zjg3ZDNiYjI3NmYzZDZhIiwiaCI6Im11cm11cjY0In0="
const ORS_DIRECTIONS = "https://api.openrouteservice.org/v2/directions/driving-car/geojson"
const POSTCODES_URL  = "https://api.postcodes.io/postcodes/"
const PHOTON_URL     = "https://photon.komoot.io/api/"
const BIAS           = {lat:53.4084, lng:-2.9916}   /* Liverpool city centre */

/* Estimation and reconciliation tuning */
const ROAD_FACTOR         = 1.25   /* straight line to road distance multiplier for gap fill */
const ASSUMED_MOVING_MPH  = 19     /* urban moving speed used to separate driving time from stopped time.
                                      Turn this dial if quotes come out consistently high or low. */
const M_PER_YARD          = 0.9144
const M_PER_MILE          = 1609.34
const YARDS_TO_MILES_AT   = 880    /* metres. Below half a mile the banner speaks yards, above it speaks miles. */
const EST_LOW             = 0.90
const EST_HIGH            = 1.20
const OFF_ROUTE_METRES    = 100
const OFF_ROUTE_FIXES     = 4

const FULL_PC    = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i
const PARTIAL_PC = /^[A-Z]{1,2}\d[A-Z\d]?$/i

let running = false, watch, timer, wakeLock = null
let distance = 0, elapsed = 0, lastPos = null, speed = 0
let accumulatedFare = 0, currentTariff = "Day", tripStartTime = null
let startCoord = null, endCoord = null
let validatedDriverId = null, validatedDriverName = null

let destination = null, quoted = null
let navSteps = [], currentStepIdx = 0, routeCoords = [], arrivalSpoken = false
let offRouteCount = 0, rerouting = false
let routeLine = null, destMarker = null

let lastTickWall = 0
let pendingGap = null, gapTimer = null
let gapDistanceTotal = 0, gapEventCount = 0

/*  Tariff constants are stored in metres and seconds because that is what the
    Geolocation API returns. Imperial equivalents are noted so each figure can be
    checked line by line against the published council tariff table.

      distStep1     150.9 m = 165 yd exactly
                    187.5 m = 205.1 yd, NOT a round imperial figure. Verify this one.
      distStep2     274.3 m = 300 yd exactly
      distThreshold 41148 m = 45,000 yd = 25.57 miles
      speedThreshold 10 km/h = 6.21 mph. Probably meant to be 6 mph (9.656 km/h).
                    As set, it is about 3% high, which favours the passenger.
                    Do not change either figure without checking the council table first.  */
const TARIFFS = {
  Day:     {base:3.40,tickValue:0.20,distStep1:150.9,distStep2:274.3,distThreshold:41148,timeStep:60,speedThreshold:10},
  Night:   {base:3.75,tickValue:0.25,distStep1:187.5,distStep2:274.3,distThreshold:41148,timeStep:60,speedThreshold:10},
  Holiday: {base:3.75,tickValue:0.25,distStep1:187.5,distStep2:274.3,distThreshold:41148,timeStep:60,speedThreshold:10},
  Extra:   {base:4.50,tickValue:0.30,distStep1:187.5,distStep2:274.3,distThreshold:41148,timeStep:60,speedThreshold:10}
}
let distanceAccumulator = 0, timeAccumulator = 0, activeTariff = TARIFFS.Day

const distanceEl        = document.getElementById("distance")
const timeEl            = document.getElementById("time")
const fareEl            = document.getElementById("fare")
const startBtn          = document.getElementById("startBtn")
const resetBtn          = document.getElementById("resetBtn")
const gps               = document.getElementById("gps")
const historyDiv        = document.getElementById("history")
const todayEarnElem     = document.getElementById("todayEarn")
const weekEarnElem      = document.getElementById("weekEarn")
const monthEarnElem     = document.getElementById("monthEarn")
const lifeEarnElem      = document.getElementById("lifeEarn")
const avgFareElem       = document.getElementById("avgFare")
const tariffElem        = document.getElementById("tariff")
const syncBtn           = document.getElementById("syncBtn")
const syncStatus        = document.getElementById("syncStatus")
const driverInput       = document.getElementById("driverInput")
const verifyBtn         = document.getElementById("verifyBtn")
const driverNameDisplay = document.getElementById("driverNameDisplay")
const idStatus          = document.getElementById("idStatus")
const destInput         = document.getElementById("destInput")
const suggestions       = document.getElementById("suggestions")
const destStatus        = document.getElementById("destStatus")
const estimateBox       = document.getElementById("estimateBox")
const clearDestBtn      = document.getElementById("clearDestBtn")
const navBanner         = document.getElementById("navBanner")
const navDist           = document.getElementById("navDist")
const navText           = document.getElementById("navText")
const navMeta           = document.getElementById("navMeta")
const gapNotice         = document.getElementById("gapNotice")

let map = L.map("map").setView([BIAS.lat,BIAS.lng],13)
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map)
let polyline = L.polyline([],{color:"lime"}).addTo(map)
let route = []

/* ---------- Driver ID ---------- */

function onIdInput(){
  let raw = driverInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"")
  if(raw.length > 2) raw = raw.slice(0,2)+"-"+raw.slice(2,7)
  driverInput.value = raw
  validatedDriverId = null; validatedDriverName = null
  driverNameDisplay.style.display = "none"
  idStatus.innerText = ""
  startBtn.disabled = true
  startBtn.textContent = "Verify ID First"
}

/* ---------- Backend transport ---------- */

/* Every backend call goes through here so a failure names its actual cause
   instead of blaming the connection. The three failure modes look identical
   to the old code but need completely different fixes:
     network  device offline, OR the deployment is not set to "Anyone" access
     http     the script ran and returned an error status
     parse    something answered but it was not JSON, usually a Google error page  */
function describeNonJson(text){
  const t = String(text||"").slice(0,600)
  if(/accounts\.google\.com|Sign in|ServiceLogin/i.test(t))
    return "Google returned a sign-in page. Set the deployment's 'Who has access' to Anyone."
  if(/Script function not found/i.test(t))
    return "Deployment is live but doPost was not found. Redeploy a new version."
  if(/Authorization is required|requires authorization/i.test(t))
    return "The script needs re-authorising. Run any function once from the editor and accept the prompts."
  if(/Moved Temporarily|Found\. Redirecting/i.test(t))
    return "The request was redirected, which usually means the access setting is not Anyone."
  if(/^\s*</.test(t))
    return "Received an HTML page instead of JSON. Check the deployment URL and its access setting."
  return "Response was not valid JSON: " + t.slice(0,120)
}

async function postToBackend(payload){
  let res, text
  try{
    res = await fetch(SYNC_URL,{method:"POST",body:JSON.stringify(payload)})
  }catch(netErr){
    const e = new Error("No response from the backend. Either the device is offline, or the deployment's access is not set to Anyone, which redirects to a sign-in page the app cannot read.")
    e.kind = "network"; throw e
  }
  try{ text = await res.text() }
  catch(readErr){ const e = new Error("Server replied but the body could not be read."); e.kind="read"; throw e }

  if(/accounts\.google\.com/i.test(res.url||"")){
    const e = new Error("Redirected to Google sign-in. Set 'Who has access' to Anyone and redeploy.")
    e.kind = "auth"; throw e
  }
  if(!res.ok){
    const e = new Error("HTTP "+res.status+(res.statusText?" "+res.statusText:"")+". "+describeNonJson(text))
    e.kind = "http"; e.status = res.status; e.body = text; throw e
  }
  try{ return JSON.parse(text) }
  catch(parseErr){
    const e = new Error(describeNonJson(text))
    e.kind = "parse"; e.body = text; throw e
  }
}

function reportBackendError(el,err,context){
  console.error("[taxi] "+context+" failed:",err,err && err.body ? err.body.slice(0,1000) : "")
  el.style.color = "#ff9f0a"
  el.innerText = "⚠ " + (err && err.message ? err.message : "Unknown error") + " (details in console)"
}

async function validateId(){
  const id = driverInput.value.trim().toUpperCase()
  if(id.length < 7){ idStatus.style.color="#ff3b30"; idStatus.innerText="Enter a valid ID (e.g. TX-A7K3M)"; return }
  verifyBtn.disabled = true; idStatus.style.color="#999"; idStatus.innerText="Verifying..."
  try{
    const json = await postToBackend({type:"validate",driverId:id})
    if(json.valid && json.active){
      validatedDriverId=id; validatedDriverName=json.name
      driverNameDisplay.style.display="block"; driverNameDisplay.innerText="✓ "+json.name
      idStatus.style.color="#34c759"; idStatus.innerText="ID verified"
      startBtn.disabled=false; startBtn.textContent="Start Trip"
      localStorage.lastDriverId=id
    } else if(json.valid && !json.active){
      idStatus.style.color="#ff3b30"; idStatus.innerText="⛔ Account suspended. Contact your manager."; lockApp()
    } else {
      idStatus.style.color="#ff3b30"; idStatus.innerText="✗ ID not recognised"; lockApp()
    }
  }catch(err){ reportBackendError(idStatus,err,"validate") }
  verifyBtn.disabled = false
}

function lockApp(){
  validatedDriverId=null; validatedDriverName=null
  startBtn.disabled=true; startBtn.textContent="Verify ID First"
  driverNameDisplay.style.display="none"
}

/* ---------- Destination lookup ---------- */

let suggestTimer = null
destInput.addEventListener("input",()=>{
  clearTimeout(suggestTimer)
  const q = destInput.value.trim()
  destStatus.innerText = ""
  if(q.length < 3){ suggestions.innerHTML=""; return }
  suggestTimer = setTimeout(()=>lookupSuggestions(q),350)
})
destInput.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(suggestTimer); lookupSuggestions(destInput.value.trim()) } })

function photonLabel(f){
  const p = f.properties || {}
  const parts = []
  if(p.name) parts.push(p.name)
  if(p.housenumber && p.street) parts.push(p.housenumber+" "+p.street)
  else if(p.street && p.street!==p.name) parts.push(p.street)
  if(p.postcode) parts.push(p.postcode)
  if(p.city && p.city!==p.name) parts.push(p.city)
  return parts.join(", ") || "Unnamed location"
}

async function lookupSuggestions(q){
  if(!q) return
  suggestions.innerHTML = "<div class='sugg' style='color:#888'>Searching...</div>"
  try{
    if(FULL_PC.test(q)){
      const r = await fetch(POSTCODES_URL+encodeURIComponent(q.replace(/\s+/g,"")))
      const j = await r.json()
      if(j.status===200 && j.result){
        return renderSuggestions([{label:j.result.postcode+", "+(j.result.admin_ward||j.result.admin_district||""), lat:j.result.latitude, lng:j.result.longitude}])
      }
      return renderSuggestions([])
    }
    if(PARTIAL_PC.test(q)){
      const r = await fetch(POSTCODES_URL+encodeURIComponent(q.replace(/\s+/g,""))+"/autocomplete")
      const j = await r.json()
      if(j.result && j.result.length){
        return renderSuggestions(j.result.slice(0,6).map(pc=>({label:pc, postcode:pc})))
      }
    }
    const url = PHOTON_URL+"?q="+encodeURIComponent(q)+"&limit=6&lang=en&lat="+BIAS.lat+"&lon="+BIAS.lng
    const r = await fetch(url)
    const j = await r.json()
    renderSuggestions((j.features||[]).map(f=>({label:photonLabel(f), lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]})))
  }catch(e){
    suggestions.innerHTML = ""
    destStatus.style.color="#ff9f0a"
    destStatus.innerText = "Address lookup unavailable. Check connection."
  }
}

function renderSuggestions(list){
  if(!list.length){ suggestions.innerHTML="<div class='sugg' style='color:#888'>No matches found</div>"; return }
  suggestions.innerHTML = ""
  list.forEach((item,i)=>{
    const div = document.createElement("div")
    div.className = "sugg"
    div.textContent = item.label
    div.onclick = ()=>selectDestination(item)
    suggestions.appendChild(div)
  })
}

async function selectDestination(item){
  suggestions.innerHTML = ""
  destInput.value = item.label
  if(item.postcode && (item.lat===undefined)){
    destStatus.style.color="#999"; destStatus.innerText="Resolving postcode..."
    try{
      const r = await fetch(POSTCODES_URL+encodeURIComponent(item.postcode.replace(/\s+/g,"")))
      const j = await r.json()
      if(j.status!==200||!j.result) throw "notfound"
      item.lat = j.result.latitude; item.lng = j.result.longitude
    }catch(e){ destStatus.style.color="#ff3b30"; destStatus.innerText="Could not resolve that postcode."; return }
  }
  destination = {label:item.label, lat:item.lat, lng:item.lng}
  clearDestBtn.style.display = "block"
  arrivalSpoken = false
  await buildRoute(false)
  saveTripState()
}

function clearDestination(){
  destination = null; quoted = null
  navSteps = []; routeCoords = []; currentStepIdx = 0; offRouteCount = 0; arrivalSpoken = false
  destInput.value = ""; suggestions.innerHTML = ""; destStatus.innerText = ""
  estimateBox.style.display = "none"
  clearDestBtn.style.display = "none"
  navBanner.style.display = "none"
  if(routeLine){ map.removeLayer(routeLine); routeLine = null }
  if(destMarker){ map.removeLayer(destMarker); destMarker = null }
  saveTripState()
}

function getCurrentPositionOnce(){
  return new Promise((resolve,reject)=>{
    if(lastPos) return resolve(lastPos)
    if(!navigator.geolocation) return reject("nogeo")
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>reject(e),
      {enableHighAccuracy:true,timeout:12000,maximumAge:10000}
    )
  })
}

/* ---------- Routing and estimate ---------- */

async function buildRoute(isReroute){
  if(!destination) return
  let origin
  try{ origin = await getCurrentPositionOnce() }
  catch(e){ destStatus.style.color="#ff9f0a"; destStatus.innerText="Waiting for GPS to work out the route."; return }

  if(!isReroute){ destStatus.style.color="#999"; destStatus.innerText="Calculating route..." }
  try{
    const res = await fetch(ORS_DIRECTIONS,{
      method:"POST",
      headers:{"Authorization":ORS_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({coordinates:[[origin.lng,origin.lat],[destination.lng,destination.lat]],instructions:true,units:"m"})
    })
    if(!res.ok) throw "HTTP "+res.status
    const j = await res.json()
    const feat = j.features && j.features[0]
    if(!feat) throw "No route returned"
    const seg = feat.properties.segments[0]

    routeCoords = feat.geometry.coordinates.map(c=>[c[1],c[0]])
    navSteps = (seg.steps||[]).map(s=>{
      const idx = s.way_points ? s.way_points[0] : 0
      const c = routeCoords[Math.min(idx,routeCoords.length-1)] || [origin.lat,origin.lng]
      return {instruction:s.instruction, name:s.name, point:{lat:c[0],lng:c[1]}, spokenFar:false, spokenNear:false}
    })
    currentStepIdx = 0; offRouteCount = 0

    drawRoute()
    showEstimate(seg.distance, seg.duration, isReroute)
    destStatus.innerText = ""
  }catch(e){
    destStatus.style.color="#ff3b30"
    destStatus.innerText = "Route lookup failed ("+e+"). The meter still works normally."
  }
}

function drawRoute(){
  if(routeLine) map.removeLayer(routeLine)
  if(destMarker) map.removeLayer(destMarker)
  routeLine = L.polyline(routeCoords,{color:"#0a84ff",weight:5,opacity:0.65,dashArray:"8,8"}).addTo(map)
  destMarker = L.marker([destination.lat,destination.lng]).addTo(map).bindPopup(destination.label)
  if(!running) map.fitBounds(routeLine.getBounds(),{padding:[30,30]})
}

function estimateFare(distM,durS,tariff){
  let fare = tariff.base
  let covered = 0, guard = 0
  while(guard++ < 20000){
    const step = covered < tariff.distThreshold ? tariff.distStep1 : tariff.distStep2
    if(distM - covered >= step){ covered += step; fare += tariff.tickValue } else break
  }
  const movingSec  = distM / (ASSUMED_MOVING_MPH*0.44704)   /* mph to metres per second */
  const stoppedSec = Math.max(0, durS - movingSec)
  fare += Math.floor(stoppedSec / tariff.timeStep) * tariff.tickValue
  return Math.round(fare*100)/100
}

function showEstimate(distM,durS,isReroute){
  const mid  = estimateFare(distM,durS,activeTariff)
  const low  = Math.round(mid*EST_LOW*100)/100
  const high = Math.round(mid*EST_HIGH*100)/100
  const miles = (distM/M_PER_MILE).toFixed(2)
  const mins  = Math.round(durS/60)

  if(!running && !isReroute) quoted = {low,mid,high,miles:Number(miles),mins}

  estimateBox.style.display = "block"
  estimateBox.innerHTML =
    "<div class='estLine'>"+(running?"Remaining":"Estimated")+" journey: "+miles+" mi, about "+mins+" min</div>"+
    "<div class='estFare'>£"+low.toFixed(2)+" to £"+high.toFixed(2)+"</div>"+
    "<div class='estLine'>Based on the "+currentTariff+" tariff</div>"+
    "<div class='estNote'>Guide price only. The meter reading is the amount charged. Traffic and waiting time can push the fare above this range.</div>"
}

/* ---------- Navigation guidance ---------- */

function speakNav(msg){
  try{ speechSynthesis.cancel() }catch(e){}
  speakFare(msg)
}

function updateNavigation(lat,lng){
  if(!destination){ navBanner.style.display="none"; return }

  const dToDest = getDistance(lat,lng,destination.lat,destination.lng)
  if(dToDest < 60){
    navBanner.style.display="block"
    navDist.innerText = ""
    navText.innerText = "Arriving at destination"
    navMeta.innerText = destination.label
    if(running && !arrivalSpoken){ arrivalSpoken = true; speakNav("Arriving at destination") }
    return
  }

  if(!navSteps.length){ navBanner.style.display="none"; return }

  while(currentStepIdx < navSteps.length-1){
    const m = navSteps[currentStepIdx].point
    if(getDistance(lat,lng,m.lat,m.lng) < 25) currentStepIdx++
    else break
  }

  const s = navSteps[currentStepIdx]
  const d = getDistance(lat,lng,s.point.lat,s.point.lng)

  navBanner.style.display = "block"
  navDist.innerText = d > YARDS_TO_MILES_AT
    ? (d/M_PER_MILE).toFixed(1)+" mi"
    : Math.max(10,Math.round(d/M_PER_YARD/10)*10)+" yd"
  navText.innerText = s.instruction
  navMeta.innerText = (dToDest/M_PER_MILE).toFixed(1)+" mi to "+destination.label

  if(running){
    if(d < 250 && !s.spokenFar){
      const yards = Math.max(50,Math.round(d/M_PER_YARD/50)*50)
      s.spokenFar = true; speakNav("In "+yards+" yards, "+s.instruction)
    }
    if(d < 45  && !s.spokenNear){ s.spokenNear = true; speakNav(s.instruction) }
  }

  checkOffRoute(lat,lng)
}

function checkOffRoute(lat,lng){
  if(!routeCoords.length || rerouting || !running) return
  let min = Infinity
  for(let i=0;i<routeCoords.length;i+=3){
    const d = getDistance(lat,lng,routeCoords[i][0],routeCoords[i][1])
    if(d < min) min = d
    if(min < OFF_ROUTE_METRES) break
  }
  if(min > OFF_ROUTE_METRES) offRouteCount++
  else offRouteCount = 0

  if(offRouteCount >= OFF_ROUTE_FIXES){
    offRouteCount = 0; rerouting = true
    navText.innerText = "Recalculating route"
    buildRoute(true).finally(()=>{ rerouting = false })
  }
}

/* ---------- Fare engine ---------- */

function round2(n){ return Math.round(n*100)/100 }

function formatTime(sec){
  let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
}
function toMiles(metres){ return (metres/M_PER_MILE).toFixed(2) }
function localTimestamp(){
  return new Date().toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
}
function update(){
  distanceEl.innerText=toMiles(distance)+" mi"
  timeEl.innerText=formatTime(elapsed)
  fareEl.innerText="£"+accumulatedFare.toFixed(2)
  if(gapDistanceTotal > 0){
    gapNotice.style.display="block"
    gapNotice.innerText="⚠ "+toMiles(gapDistanceTotal)+" mi estimated while the app was in the background ("+gapEventCount+" gap"+(gapEventCount===1?"":"s")+"). Recorded on the receipt."
  } else gapNotice.style.display="none"
}
function speakFare(msg){ speechSynthesis.speak(new SpeechSynthesisUtterance(msg)) }

function processTick(deltaDistance){
  if(speed>activeTariff.speedThreshold){
    distanceAccumulator+=deltaDistance
    let step=distance<activeTariff.distThreshold?activeTariff.distStep1:activeTariff.distStep2
    if(distanceAccumulator>=step){ accumulatedFare=round2(accumulatedFare+activeTariff.tickValue); distanceAccumulator=0 }
    timeAccumulator=0
  } else {
    timeAccumulator++
    if(timeAccumulator>=activeTariff.timeStep){ accumulatedFare=round2(accumulatedFare+activeTariff.tickValue); timeAccumulator=0 }
    distanceAccumulator=0
  }
}

function applyTimeTicks(sec){
  let s = timeAccumulator + sec
  while(s >= activeTariff.timeStep){ accumulatedFare = round2(accumulatedFare+activeTariff.tickValue); s -= activeTariff.timeStep }
  timeAccumulator = s
}

function applyGapDistance(metres){
  distanceAccumulator += metres
  let step = distance < activeTariff.distThreshold ? activeTariff.distStep1 : activeTariff.distStep2
  while(distanceAccumulator >= step){
    accumulatedFare = round2(accumulatedFare+activeTariff.tickValue)
    distanceAccumulator -= step
    step = distance < activeTariff.distThreshold ? activeTariff.distStep1 : activeTariff.distStep2
  }
  timeAccumulator = 0
}

/* A gap is any stretch where the browser stopped delivering GPS fixes or timer ticks.
   We wait for the next fix before deciding whether to charge distance or waiting time,
   so the passenger is never charged twice for the same seconds. */
function beginGap(seconds){
  if(seconds <= 0) return
  if(pendingGap) pendingGap.seconds += seconds
  else pendingGap = {seconds, fromPos: lastPos ? {lat:lastPos.lat,lng:lastPos.lng} : null}
  clearTimeout(gapTimer)
  gapTimer = setTimeout(resolveGapByTime,12000)
}

function resolveGapByTime(){
  if(!pendingGap) return
  applyTimeTicks(pendingGap.seconds)
  pendingGap = null
  saveTripState(); update()
}

function resolveGapWithFix(lat,lng){
  clearTimeout(gapTimer)
  const g = pendingGap; pendingGap = null
  if(!g) return
  if(!g.fromPos){ applyTimeTicks(g.seconds); return }
  const straight = getDistance(g.fromPos.lat,g.fromPos.lng,lat,lng)
  const est = straight * ROAD_FACTOR
  const avgKmh = g.seconds > 0 ? (est/g.seconds)*3.6 : 0
  if(avgKmh > activeTariff.speedThreshold){
    distance += est
    gapDistanceTotal += est
    gapEventCount++
    applyGapDistance(est)
  } else {
    applyTimeTicks(g.seconds)
  }
}

function tickOnce(){
  const now = Date.now()
  let delta = Math.floor((now-lastTickWall)/1000)
  if(delta < 1) return
  lastTickWall += delta*1000
  elapsed += delta
  updateTariff()
  if(delta <= 3){ for(let i=0;i<delta;i++) processTick(0) }
  else beginGap(delta)
  saveTripState(); update()
}

/* ---------- Trip state ---------- */

async function keepScreenAwake(){
  try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen") }catch(e){}
}

function saveTripState(){
  if(!running) return
  localStorage.activeTripState=JSON.stringify({
    running,distance,elapsed,accumulatedFare,currentTariff,startCoord,lastPos,
    distanceAccumulator,timeAccumulator,tripStartTime,validatedDriverId,validatedDriverName,
    destination,quoted,gapDistanceTotal,gapEventCount,savedAt:Date.now()
  })
}

function restoreTripState(){
  const saved=localStorage.activeTripState
  if(!saved) return false
  try{
    const s=JSON.parse(saved)
    if(!s.running) return false
    distance=s.distance||0; accumulatedFare=s.accumulatedFare||0; currentTariff=s.currentTariff||"Day"
    startCoord=s.startCoord||null; lastPos=s.lastPos||null
    distanceAccumulator=s.distanceAccumulator||0; timeAccumulator=s.timeAccumulator||0
    tripStartTime=s.tripStartTime||null; validatedDriverId=s.validatedDriverId||null; validatedDriverName=s.validatedDriverName||null
    destination=s.destination||null; quoted=s.quoted||null
    gapDistanceTotal=s.gapDistanceTotal||0; gapEventCount=s.gapEventCount||0
    activeTariff=TARIFFS[currentTariff]||TARIFFS.Day
    elapsed=s.elapsed||0
    const secondsAway=Math.floor((Date.now()-s.savedAt)/1000)
    elapsed += Math.max(0,secondsAway)
    lastTickWall = Date.now()
    beginGap(secondsAway)
    return true
  }catch(e){ return false }
}
function clearTripState(){ localStorage.removeItem("activeTripState") }

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(wakeLock!==null) keepScreenAwake()
    if(running) tickOnce()
  }
})

/* ---------- Tariff calendar ---------- */

function getEaster(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3)
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451)
  return new Date(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1)
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate() }
function firstMonday(y,m){ let d=new Date(y,m,1); while(d.getDay()!==1)d.setDate(d.getDate()+1); return d }
function lastMonday(y,m){ let d=new Date(y,m+1,0); while(d.getDay()!==1)d.setDate(d.getDate()-1); return d }
function substituted(y,m,day){ let d=new Date(y,m,day); if(d.getDay()===0)d.setDate(d.getDate()+1); else if(d.getDay()===6)d.setDate(d.getDate()+2); return d }
function isUKBankHoliday(now){
  const y=now.getFullYear(),easter=getEaster(y)
  const gf=new Date(easter); gf.setDate(easter.getDate()-2)
  const em=new Date(easter); em.setDate(easter.getDate()+1)
  return [substituted(y,0,1),gf,em,firstMonday(y,4),lastMonday(y,4),lastMonday(y,7),substituted(y,11,25),substituted(y,11,26)].some(bh=>sameDay(now,bh))
}
function isExtraRate(now){
  const y=now.getFullYear()
  return [[new Date(y,11,24,18),new Date(y,11,27,6)],[new Date(y,11,31,18),new Date(y+1,0,2,6)],[new Date(y-1,11,31,18),new Date(y,0,2,6)]].some(([s,e])=>now>=s&&now<e)
}
function updateTariff(){
  const now=new Date(),hour=now.getHours()
  if(isExtraRate(now)){ activeTariff=TARIFFS.Extra;currentTariff="Extra";tariffElem.innerText="Extra";tariffElem.style.background="#4a1a1a";tariffElem.style.color="#ff6b6b" }
  else if(isUKBankHoliday(now)&&(hour>=6&&hour<21)){ activeTariff=TARIFFS.Holiday;currentTariff="Holiday";tariffElem.innerText="Holiday";tariffElem.style.background="#2c1f4a";tariffElem.style.color="#bf9fff" }
  else if(hour<6||hour>=21){ activeTariff=TARIFFS.Night;currentTariff="Night";tariffElem.innerText="Night";tariffElem.style.background="#2c1f4a";tariffElem.style.color="#bf9fff" }
  else { activeTariff=TARIFFS.Day;currentTariff="Day";tariffElem.innerText="Day";tariffElem.style.background="#333";tariffElem.style.color="#fff" }
}
updateTariff()

/* ---------- GPS ---------- */

function onPosition(p){
  const lat=p.coords.latitude, lng=p.coords.longitude
  speed = p.coords.speed ? p.coords.speed*3.6 : 0
  gps.innerText = "GPS active"
  if(!startCoord && running) startCoord={lat,lng}

  if(pendingGap) resolveGapWithFix(lat,lng)
  else if(lastPos && running){
    const delta = getDistance(lastPos.lat,lastPos.lng,lat,lng)
    distance += delta
    processTick(delta)
  }

  lastPos = {lat,lng}
  if(running){
    route.push([lat,lng]); polyline.setLatLngs(route)
    map.setView([lat,lng],16)
  }
  updateNavigation(lat,lng)
  if(running){ saveTripState(); update() }
}

function startWatch(){
  watch = navigator.geolocation.watchPosition(
    onPosition,
    ()=>{ gps.innerText="GPS error" },
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000}
  )
}

/* ---------- Trip control ---------- */

async function startTrip(){
  if(!validatedDriverId){ alert("Please verify your Driver ID before starting a trip."); driverInput.focus(); return }

  startBtn.disabled=true; startBtn.textContent="Checking..."
  try{
    const json = await postToBackend({type:"validate",driverId:validatedDriverId})
    if(!json.valid || !json.active){
      idStatus.style.color="#ff3b30"
      idStatus.innerText="⛔ Account suspended. Contact your manager."
      lockApp(); return
    }
  } catch(err){
    startBtn.disabled=false; startBtn.textContent="Start Trip"
    reportBackendError(idStatus,err,"pre-trip validate")
    alert("Cannot start the trip.\n\n"+(err && err.message ? err.message : "Unknown error"))
    return
  }

  notifyOwner(validatedDriverId,validatedDriverName,"Started Trip"+(destination?" to "+destination.label:""))
  running=true; startCoord=null; endCoord=null; distanceAccumulator=0; timeAccumulator=0
  gapDistanceTotal=0; gapEventCount=0; pendingGap=null
  accumulatedFare=activeTariff.base; tripStartTime=localTimestamp()
  lastTickWall=Date.now()
  arrivalSpoken=false
  keepScreenAwake()
  startBtn.textContent="Stop Trip"; startBtn.className="stop"; startBtn.disabled=false; resetBtn.disabled=true
  speakFare("Trip started")
  timer=setInterval(tickOnce,1000)
  if(watch) navigator.geolocation.clearWatch(watch)
  startWatch()
}

function stopTrip(){
  if(!running) return
  const miles=toMiles(distance), duration=formatTime(elapsed), totalStr=accumulatedFare.toFixed(2)
  if(!confirm("End this trip?\n\nDistance: "+miles+" mi\nTime: "+duration+"\nFare: £"+totalStr)) return
  notifyOwner(validatedDriverId,validatedDriverName,"Ended Trip - £"+totalStr)
  running=false; clearInterval(timer); clearTimeout(gapTimer); pendingGap=null
  if(watch){ navigator.geolocation.clearWatch(watch); watch=null }
  if(wakeLock){ wakeLock.release(); wakeLock=null }
  clearTripState(); endCoord=lastPos
  startBtn.textContent="Start Trip"; startBtn.className="start"; resetBtn.disabled=false
  navBanner.style.display="none"
  speakFare("Trip complete. Total fare is "+totalStr+" pounds")
  saveTrip(totalStr); showReceipt(miles,duration,totalStr); update(); resetTrip()
}

function showReceipt(miles,duration,totalStr){
  let receipt="Taxi Receipt\n\nDriver: "+validatedDriverName+"\nID: "+validatedDriverId+
    "\nDistance: "+miles+" mi\nTime: "+duration+"\nFare: £"+totalStr+"\nTariff: "+currentTariff
  if(destination) receipt+="\nDestination: "+destination.label
  if(quoted) receipt+="\nQuoted range: £"+quoted.low.toFixed(2)+" to £"+quoted.high.toFixed(2)
  if(gapDistanceTotal>0) receipt+="\nEstimated distance while backgrounded: "+toMiles(gapDistanceTotal)+" mi"
  receipt+="\nStart: "+(startCoord?"https://maps.google.com/?q="+startCoord.lat+","+startCoord.lng:"N/A")+
    "\nEnd: "+(endCoord?"https://maps.google.com/?q="+endCoord.lat+","+endCoord.lng:"N/A")+
    "\nDate: "+localTimestamp()
  alert(receipt); shareReceipt(receipt)
}
async function shareReceipt(receipt){
  try{ if(navigator.share){await navigator.share({title:"Taxi Receipt",text:receipt});return} throw "noShare" }
  catch(e){
    try{ await navigator.clipboard.writeText(receipt); alert("Receipt copied to clipboard.") }
    catch(e2){ let b=new Blob([receipt],{type:"text/plain"}),l=document.createElement("a"); l.href=URL.createObjectURL(b); l.download="taxi_receipt.txt"; l.click() }
  }
}

function resetTrip(){
  distance=elapsed=accumulatedFare=0; lastPos=startCoord=endCoord=null
  distanceAccumulator=timeAccumulator=0; tripStartTime=null; route=[]; polyline.setLatLngs([])
  gapDistanceTotal=0; gapEventCount=0; pendingGap=null
  clearDestination()
  accumulatedFare=activeTariff.base
  update()
}

function getDistance(a,b,c,d){
  const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))
}

/* ---------- Records ---------- */

function saveTrip(total){
  let trips=JSON.parse(localStorage.trips||"[]")
  const tripId=crypto.randomUUID()
  trips.unshift({
    tripId,fare:Number(total),miles:toMiles(distance),time:formatTime(elapsed),date:localTimestamp(),
    tariff:currentTariff,start:startCoord,end:endCoord,
    destination:destination?destination.label:"",
    destLat:destination?destination.lat:"",destLng:destination?destination.lng:"",
    quotedLow:quoted?quoted.low:"",quotedHigh:quoted?quoted.high:"",quotedMiles:quoted?quoted.miles:"",
    estimatedMiles:gapDistanceTotal>0?toMiles(gapDistanceTotal):"0.00",gapEvents:gapEventCount,
    driverId:validatedDriverId,driverName:validatedDriverName,synced:false
  })
  localStorage.trips=JSON.stringify(trips); renderHistory(); updateDashboard()
}

function renderHistory(){
  let trips=JSON.parse(localStorage.trips||"[]"), html=""
  trips.slice(0,5).forEach(t=>{
    let dist=t.miles||(t.km?(t.km*0.621371).toFixed(2):"0.00")
    let badge=t.synced?'<span style="color:#34c759;font-size:12px"> ✓ synced</span>':'<span style="color:#ff9f0a;font-size:12px"> ● unsynced</span>'
    let dest=t.destination?'<br><span style="color:#888;font-size:13px">to '+t.destination+'</span>':''
    html+=`<div class="history">£${Number(t.fare).toFixed(2)} • ${dist} mi • ${t.time} • ${t.tariff||"Day"}${badge}${dest}<br>${t.date}</div>`
  })
  historyDiv.innerHTML=html||"<div style='color:#666'>No trips yet</div>"
}

function csvSafe(v){
  const s = (v===undefined||v===null)?"":String(v)
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s
}

function exportTrips(){
  let trips=JSON.parse(localStorage.trips||"[]")
  if(!trips.length){ alert("No trips"); return }
  let csv="Driver ID,Driver Name,Date,Time,Duration,Fare (£),Tariff,Destination,Quoted Low (£),Quoted High (£),Quoted Miles,Estimated Miles,Gap Events,Start Coords,End Coords,Trip ID\n"
  trips.forEach(t=>{
    let s=t.start?t.start.lat+" "+t.start.lng:"N/A", e=t.end?t.end.lat+" "+t.end.lng:"N/A"
    let datePart=t.date.split(", ")[0]||"", timePart=t.date.split(", ")[1]||""
    csv+=[t.driverId,t.driverName,datePart,timePart,t.time,t.fare,t.tariff||"Day",t.destination,t.quotedLow,t.quotedHigh,t.quotedMiles,t.estimatedMiles,t.gapEvents,s,e,t.tripId].map(csvSafe).join(",")+"\n"
  })
  let b=new Blob([csv],{type:"text/csv"}),l=document.createElement("a"); l.href=URL.createObjectURL(b); l.download="taxi_trips.csv"; l.click()
}

function updateDashboard(){
  let trips=JSON.parse(localStorage.trips||"[]"),today=new Date(),todayEarn=0,week=0,month=0,life=0
  trips.forEach(t=>{
    let d=new Date(t.date),f=Number(t.fare); life+=f
    if(d.toDateString()===today.toDateString()) todayEarn+=f
    if((today-d)/(1000*60*60*24)<7) week+=f
    if(d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear()) month+=f
  })
  let avg=trips.length?life/trips.length:0
  todayEarnElem.innerText=todayEarn.toFixed(2); weekEarnElem.innerText=week.toFixed(2)
  monthEarnElem.innerText=month.toFixed(2); lifeEarnElem.innerText=life.toFixed(2); avgFareElem.innerText=avg.toFixed(2)
}

async function syncToSheet(){
  if(!validatedDriverId){ alert("Please verify your Driver ID before syncing."); driverInput.focus(); return }
  let trips=JSON.parse(localStorage.trips||"[]"), unsynced=trips.filter(t=>!t.synced)
  if(!unsynced.length){ syncStatus.style.color="#34c759"; syncStatus.innerText="✓ All trips already synced."; return }
  syncBtn.disabled=true; syncStatus.style.color="#999"; syncStatus.innerText="Syncing "+unsynced.length+" trip(s)..."
  try{
    const json = await postToBackend({type:"sync",driverId:validatedDriverId,driverName:validatedDriverName,trips:unsynced})
    if(json.status==="ok"){
      const syncedIds=new Set(unsynced.map(t=>t.tripId))
      trips=trips.map(t=>syncedIds.has(t.tripId)?{...t,synced:true}:t)
      localStorage.trips=JSON.stringify(trips); renderHistory()
      let msg="✓ Synced "+json.inserted+" trip(s) at "+localTimestamp()
      if(json.skipped>0) msg+=" ("+json.skipped+" duplicate(s) skipped)"
      if(json.errors&&json.errors.length) msg+=" | Errors: "+json.errors.join("; ")
      syncStatus.style.color="#34c759"; syncStatus.innerText=msg
    } else throw new Error(json.message||"Backend rejected the sync without giving a reason")
  }catch(err){
    console.error("[taxi] sync failed:",err,err && err.body ? err.body.slice(0,1000) : "")
    syncStatus.style.color="#ff3b30"
    syncStatus.innerText="✗ Sync failed: "+(err && err.message ? err.message : err)
  }
  syncBtn.disabled=false
}

/* Fire and forget. A failed log must never block or delay a trip, but it should
   still leave a trace in the console rather than vanishing silently. */
function notifyOwner(driverId,driverName,action){
  postToBackend({type:"instantLog",driverId,driverName,action,timestamp:localTimestamp()})
    .catch(err=>console.warn("[taxi] instant log not delivered:",err && err.message ? err.message : err))
}

/* ---------- Boot ---------- */

startBtn.onclick=function(){ running?stopTrip():startTrip() }
resetBtn.onclick=resetTrip

updateTariff()

if(localStorage.lastDriverId){
  driverInput.value=localStorage.lastDriverId
  idStatus.style.color="#999"; idStatus.innerText="Press Verify to re-authenticate"
}

const wasRunning=restoreTripState()
if(wasRunning&&validatedDriverId){
  running=true; startBtn.textContent="Stop Trip"; startBtn.className="stop"; startBtn.disabled=false; resetBtn.disabled=true
  driverInput.value=validatedDriverId; driverNameDisplay.style.display="block"; driverNameDisplay.innerText="✓ "+validatedDriverName
  idStatus.style.color="#34c759"; idStatus.innerText="Trip in progress"; gps.innerText="Resuming trip..."
  if(destination){ destInput.value=destination.label; clearDestBtn.style.display="block"; buildRoute(true) }
  keepScreenAwake()
  lastTickWall=Date.now()
  timer=setInterval(tickOnce,1000)
  startWatch()
} else {
  accumulatedFare=activeTariff.base
  startWatch()   /* idle watch so a destination can be priced before the trip starts */
}

update(); renderHistory(); updateDashboard()
</script>
